name: CI

on:
  push:
  pull_request:

env:
  EMSDK_VERSION: 6.0.10

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run Unity tests
        run: make test
      - name: Run every scenario
        run: make scenarios
      - uses: actions/upload-artifact@v4
        with:
          name: scenario-csv
          path: build/csv/

  wasm-browser:
    name: WASM and browser tests
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache Emscripten
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ runner.os }}-${{ env.EMSDK_VERSION }}
      - name: Install Emscripten
        run: |
          [ -d ~/emsdk ] || git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install "$EMSDK_VERSION"
          ~/emsdk/emsdk activate "$EMSDK_VERSION"
      - name: WASM build vs native
        run: make test-wasm
      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Dashboard in headless Chromium
        run: make test-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-screenshots
          path: build/screenshots/
